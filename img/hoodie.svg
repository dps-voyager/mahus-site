<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-label="Black oversized pullover hoodie with hood, drawstrings and kangaroo pocket">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="0.45" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <!-- body + full-length dropped-shoulder sleeves -->
  <path d="M150,110 L104,116 L54,202 L10,308 L78,344 L114,244 L118,436 L282,436 L286,244 L322,344 L390,308 L346,202 L296,116 L250,110 Z"
        fill="url(#body)" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M150,110 L104,116 L54,202 L10,308 L78,344 L114,244 L118,436 L282,436 L286,244 L322,344 L390,308 L346,202 L296,116 L250,110 Z"
        fill="url(#shade)"/>

  <!-- cuff ribs -->
  <path d="M10,308 L78,344 L82.6,334 L14.6,298 Z" fill="url(#rib)" stroke="#2f2f2f" stroke-width="1"/>
  <path d="M390,308 L322,344 L317.4,334 L385.4,298 Z" fill="url(#rib)" stroke="#2f2f2f" stroke-width="1"/>
  <path d="M18,290 L82,322" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M382,290 L318,322" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- side shading -->
  <path d="M126,250 L126,404" stroke="#ffffff" stroke-opacity="0.05" stroke-width="6"/>
  <path d="M274,250 L274,404" stroke="#000000" stroke-opacity="0.30" stroke-width="8"/>

  <!-- kangaroo pocket -->
  <path d="M142,332 L258,332 L272,404 L128,404 Z" fill="url(#rib)" stroke="#313131" stroke-width="1.2"/>
  <path d="M150,338 L175,367" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <path d="M250,338 L225,367" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- hem rib -->
  <path d="M118,410 L282,410 L282,436 L118,436 Z" fill="url(#rib)" stroke="#2f2f2f" stroke-width="1"/>
  <path d="M124,410 L276,410" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- hood -->
  <path d="M146,104 C140,44 172,14 200,14 C228,14 260,44 254,104 C254,122 228,136 200,136 C172,136 146,122 146,104 Z"
        fill="url(#body)" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M146,104 C140,44 172,14 200,14 C228,14 260,44 254,104 C254,122 228,136 200,136 C172,136 146,122 146,104 Z"
        fill="url(#shade)"/>
  <!-- neck opening (straddles the hood's lower edge) -->
  <ellipse cx="200" cy="132" rx="34" ry="26" fill="#040404" stroke="#242424" stroke-width="1"/>
  <path d="M170,128 A32,24 0 0 1 230,128" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <path d="M175,134 A25,18 0 0 1 225,134" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- eyelets + drawstrings -->
  <circle cx="189" cy="156" r="3.2" fill="#000" stroke="#4a4a4a" stroke-width="1"/>
  <circle cx="211" cy="156" r="3.2" fill="#000" stroke="#4a4a4a" stroke-width="1"/>
  <path d="M189,159 C187,182 185,198 186,220" fill="none" stroke="#e8e8e8" stroke-width="3" stroke-linecap="round"/>
  <path d="M211,159 C213,184 215,204 214,216" fill="none" stroke="#e8e8e8" stroke-width="3" stroke-linecap="round"/>
  <rect x="183" y="219" width="6" height="10" rx="2" fill="#cfcfcf"/>
  <rect x="211" y="215" width="6" height="10" rx="2" fill="#cfcfcf"/>
</svg>
